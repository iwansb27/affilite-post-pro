name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bridge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugging Face Hub CLI
        run: python -m pip install --upgrade huggingface_hub

      - name: Deploy repository to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: iwansb27/huggingface-deploy-bridge-gpt
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not configured in GitHub."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add huggingface "https://iwansb27:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}.git"
          git push --force huggingface HEAD:main
